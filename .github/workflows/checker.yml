name: LootPing Deal Checker

on:
  schedule:
    # Runs twice a day: 12:00 AM (midnight) and 6:00 PM (18:30 UTC & 12:30 UTC in IST)
    - cron: '30 12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: lootping-checker
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LootPing Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GIVEAWAY_TYPE: ${{ vars.GIVEAWAY_TYPE || 'game' }}
          ALLOWED_PLATFORMS: ${{ vars.ALLOWED_PLATFORMS || 'steam, epic, xbox, playstation, gog, ubisoft, prime' }}
          ENABLE_CHEAPSHARK: ${{ vars.ENABLE_CHEAPSHARK || 'true' }}
        run: |
          python main.py

      - name: Commit and Push State Cache
        run: |
          if [ -n "$(git status --porcelain data/alerted_ids.json)" ]; then
            echo "State cache changes detected. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/alerted_ids.json
            git commit -m "chore: update alerted deals state [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push
          else
            echo "No state cache changes to commit."
          fi
